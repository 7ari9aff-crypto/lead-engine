# Lead Engine — worker fleet (Phase 3 compute plane skeleton)
# The worker executes queued jobs; scale = replicas here, dedicated
# namespaces per enterprise tenant later (same image, same contracts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-engine-worker
  labels: { app: lead-engine-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: lead-engine-worker }
  template:
    metadata:
      labels: { app: lead-engine-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/7ari9aff-crypto/lead-engine:latest
          command: ["python", "-m", "lead_engine", "worker", "--poll", "5"]
          envFrom:
            - secretRef: { name: lead-engine-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-engine-event-worker
  labels: { app: lead-engine-event-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: lead-engine-event-worker }
  template:
    metadata:
      labels: { app: lead-engine-event-worker }
    spec:
      containers:
        - name: event-worker
          image: ghcr.io/7ari9aff-crypto/lead-engine:latest
          # NO --once: the CLI exits after a single dispatch pass, which would
          # turn this Deployment into a CrashLoopBackOff restart loop instead
          # of a long-running dispatcher. The bare command is the daemon.
          command: ["python", "-m", "lead_engine", "event-worker", "--poll", "2"]
          envFrom:
            - secretRef: { name: lead-engine-secrets }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lead-engine-data-retention
spec:
  schedule: "17 3 * * *"   # daily purge of retention-expired leads
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: purge
              image: ghcr.io/7ari9aff-crypto/lead-engine:latest
              command: ["python", "-c"]
              args:
                - |
                  from lead_engine.config import load_env; load_env()
                  from lead_engine.db import open_db
                  from lead_engine.entitlements import get_limits
                  from datetime import datetime, timedelta, timezone

                  db = open_db()
                  try:
                      # Per-org retention from organizations.limits. db.org_id
                      # is set per org so RLS (app.current_org) scopes every
                      # statement — an org-less connection only ever sees
                      # NULL-org rows and would silently delete nothing. Run
                      # this job with the service-role DSN.
                      for o in db.query("SELECT id FROM public.organizations"):
                          org_id = o["id"]
                          db.org_id = org_id
                          days = int(get_limits(db, org_id).get("retention_days") or 30)
                          cutoff = (datetime.now(timezone.utc) - timedelta(days=days)) \
                              .strftime("%Y-%m-%dT%H:%M:%SZ")
                          db.execute(
                              "DELETE FROM evidence WHERE lead_id IN"
                              " (SELECT lead_id FROM leads WHERE created_at < ?)",
                              (cutoff,))
                          db.execute("DELETE FROM leads WHERE created_at < ?", (cutoff,))
                      print("retention purge done")
                  finally:
                      db.close()
              envFrom:
                - secretRef: { name: lead-engine-secrets }

# V6 durable worker on GitHub Actions — the always-on execution plane.
#
# Every 10 minutes a runner boots the V6 worker for up to ~8 minutes:
#   - claims and runs queued acquisition jobs (real providers, checkpointed)
#   - lease reaper + outbox relay + doctor sentinel (alerts open/resolve)
#   - worker heartbeat
# Idempotent + checkpointed: a run that times out resumes from its last
# checkpoint on the next invocation. Secrets: SUPABASE_DB_URL (pooler DSN),
# LEAD_ENGINE_ORG_ID (credential hydration), LEAD_ENGINE_V6_MASTER_KEY,
# LEAD_ENGINE_ENCRYPTION_KEY.

name: v6-worker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Worker cycles this invocation (0 = run until timeout)"
        required: false
        default: "80"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v6-worker.yml"

permissions:
  contents: read

concurrency:
  group: v6-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the worker (drain queue + sentinel)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LEAD_ENGINE_ORG_ID: ${{ secrets.LEAD_ENGINE_ORG_ID }}
          LEAD_ENGINE_V6_MASTER_KEY: ${{ secrets.LEAD_ENGINE_V6_MASTER_KEY }}
          LEAD_ENGINE_ENCRYPTION_KEY: ${{ secrets.LEAD_ENGINE_ENCRYPTION_KEY }}
          LEAD_ENGINE_V6_PROVIDERS: real
          # Black-box probe of the deployed app in the doctor's http.surface check
          LEAD_ENGINE_PUBLIC_BASE_URL: ${{ vars.LEAD_ENGINE_PUBLIC_BASE_URL }}
          # The dispatch input goes through env, never straight into the
          # script: ${{ }} is substituted textually, so a crafted value would
          # run as shell with the secrets above in scope.
          CYCLES_INPUT: ${{ github.event.inputs.cycles }}
        run: |
          CYCLES="${CYCLES_INPUT:-80}"
          if ! [[ "$CYCLES" =~ ^[0-9]+$ ]]; then
            echo "::error::cycles must be a non-negative integer"
            exit 1
          fi
          python -m apps.worker --queues default \
            --worker-id "gh-worker-scheduled" \
            --cycles "$CYCLES"

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        # Slack-compatible webhook payload ({"text": ...}); Discord's /slack
        # endpoint accepts the same shape. Unset secret = alerting not
        # configured, step is a no-op.
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not configured — skipping alert"
            exit 0
          fi
          curl -sfX POST "$ALERT_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"v6-worker FAILED on $GITHUB_REPOSITORY — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || echo "alert webhook POST failed"

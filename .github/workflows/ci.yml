name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Tests + coverage gate
        # Floor, not a target: measured baseline on this tree is 63.6% line
        # coverage. The gate exists so coverage cannot silently regress as
        # features land; raise it as the number climbs.
        run: python -m pytest tests/ -q --cov=lead_engine --cov-fail-under=60
      - name: Lint (ruff)
        # Syntax errors + undefined names only: the tree predates linting and
        # carries legacy unused imports; broadening the gate would turn this
        # into an unrelated cleanup diff. Tighten incrementally instead.
        run: python -m ruff check lead_engine/ tests/ --select E9,F63,F7,F82
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --skip-editable
      - name: Secret scanning (gitleaks)
        # Direct binary invocation instead of gitleaks-action@v2: the wrapper
        # action fails on push events with shallow checkouts (log-opts
        # referencing commits outside the depth-1 clone). We verified this
        # exact invocation locally (full history, exit 0, config honored).
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          git fetch --unshallow --quiet 2>/dev/null || true
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      # pnpm 12 blocks dependency build scripts by default (esbuild);
      # same allowance the dev compose uses (see AGENTS.md)
      PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: Dependency audit
        run: pnpm audit --prod

name: sync-frontend-static

# The FastAPI (and the Vercel Python runtime) serve the dashboard from
# lead_engine/static. This workflow rebuilds the frontend on every main push
# and commits the refreshed build, so production can never serve a stale UI.
on:
  push:
    branches: [main]
    paths-ignore:
      - "lead_engine/static/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install and build frontend
        working-directory: web
        env:
          # pnpm 12 blocks dependency build scripts by default (esbuild);
          # the dashboard build needs them, same as docker-compose.base44.yml
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
          # Optional rotation override (Settings → Variables). Deliberately NOT
          # named VITE_*: an empty VITE_* var would take precedence over
          # `web/.env.production` and silently disable Supabase auth in the
          # built bundle. `.env.production` is the single tracked definition of
          # the Supabase project; these only exist to rotate it without a code
          # change.
          SUPABASE_URL_OVERRIDE: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY_OVERRIDE: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          pnpm install --frozen-lockfile
          if [ -n "$SUPABASE_URL_OVERRIDE" ] && [ -n "$SUPABASE_KEY_OVERRIDE" ]; then
            echo "using rotated Supabase project from repository variables"
            export VITE_SUPABASE_URL="$SUPABASE_URL_OVERRIDE"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_KEY_OVERRIDE"
          else
            echo "using the tracked web/.env.production defaults"
          fi
          pnpm build

      - name: Copy build into served static folder
        run: |
          rm -rf lead_engine/static/assets
          cp -r web/dist/assets lead_engine/static/assets
          cp web/dist/index.html lead_engine/static/index.html

      - name: Commit refreshed static build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain lead_engine/static)" ]]; then
            git add lead_engine/static
            git commit -m "chore: sync frontend build into lead_engine/static [skip ci]"
            git push
          else
            echo "static already up to date"
          fi

# Lead Engine V6 CI — architecture gates + tests
# Runs the V6 suite on main and the v6-foundation branch against a service
# Postgres (no cloud secrets needed; the suite owns its V6 schemas).

name: v6

on:
  push:
    branches: [main, v6-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledev
          POSTGRES_PASSWORD: ledev
          POSTGRES_DB: lead_engine_v6
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledev -d lead_engine_v6"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Lint (ruff) — V6 layers
        run: python -m ruff check domain application infrastructure runtime api contracts apps tests/v6

      - name: Architecture gates + tests (unit / integration / failure / security / E2E)
        env:
          LEAD_ENGINE_V6_DATABASE_URL: postgresql://ledev:ledev@localhost:5433/lead_engine_v6
        run: python -m pytest tests/v6 -q

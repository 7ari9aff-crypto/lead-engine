# Lead Engine V6 CI — architecture gates + tests
# Runs the V6 suite on main and the v6-foundation branch against a service
# Postgres (no cloud secrets needed; the suite owns its V6 schemas).

name: v6

on:
  push:
    branches: [main, v6-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledev
          POSTGRES_PASSWORD: ledev
          POSTGRES_DB: lead_engine_v6
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ledev -d lead_engine_v6"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Lint (ruff) — V6 layers
        run: python -m ruff check domain application infrastructure runtime v6api contracts apps tests/v6

      - name: Create application roles (admin + restricted app role)
        run: |
          python - <<'PY'
          import psycopg
          c = psycopg.connect('postgresql://ledev:ledev@localhost:5433/lead_engine_v6', autocommit=True)
          c.execute("DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'lead_engine') THEN CREATE ROLE lead_engine LOGIN PASSWORD 'v6-ci-app'; END IF; END $$;")
          c.close()
          PY

      - name: Verify RLS posture (role + force flags)
        run: |
          python - <<'PY'
          import psycopg
          a = psycopg.connect('postgresql://ledev:ledev@localhost:5433/lead_engine_v6', autocommit=True)
          print('admin user:', a.execute("select current_user, (select rolsuper from pg_roles where rolname = current_user)").fetchone())
          a.execute("create table if not exists public._rls_probe(i int)")
          a.execute("insert into public._rls_probe values (1)")
          a.execute("alter table public._rls_probe enable row level security")
          a.execute("alter table public._rls_probe force row level security")
          app = psycopg.connect('postgresql://lead_engine:v6-ci-app@localhost:5433/lead_engine_v6', autocommit=True)
          print('app user:', app.execute("select current_user, (select rolsuper from pg_roles where rolname = current_user), (select rolbypassrls from pg_roles where rolname = current_user)").fetchone())
          print('probe rows seen by app:', app.execute("select count(*) from public._rls_probe").fetchone())
          a.execute("drop table public._rls_probe")
          a.close(); app.close()
          PY

      - name: Architecture gates + tests (unit / integration / failure / security / E2E)
        env:
          LEAD_ENGINE_V6_DATABASE_URL: postgresql://lead_engine:v6-ci-app@localhost:5433/lead_engine_v6
          LEAD_ENGINE_V6_ADMIN_DATABASE_URL: postgresql://ledev:ledev@localhost:5433/lead_engine_v6
        run: python -m pytest tests/v6 -q
